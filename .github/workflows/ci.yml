name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # The release profile is what ships, and it is the one that can fail on
      # its own (lto, panic = "abort"), so it is built here rather than first
      # discovered by a tag push.
      - name: Build
        run: cargo build --release
