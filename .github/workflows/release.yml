name: release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The tag names the release and Cargo.toml names the binary. A release
      # where they disagree ships an artifact whose file name lies about what is
      # inside it, and the consumer pins the file name.
      - name: Check the tag against the manifest
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tagged" != "$manifest" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest" >&2
            exit 1
          fi

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
          sudo apt-get update && sudo apt-get install -y musl-tools

      # musl so the artifact drops into an image with no library concerns,
      # which is the point of the whole distribution path.
      - name: Build
        run: cargo build --release --target "$TARGET"

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          asset="shiro-$ver-$TARGET.tar.gz"
          binary="target/$TARGET/release/shiro"

          # A build that exits 0 and leaves nothing behind is worse than a build
          # that fails, so the artifact is checked before it is wrapped: it
          # exists, it is not a stub, and it runs.
          test -x "$binary"
          test "$(stat -c%s "$binary")" -gt 200000
          "$binary" version

          tar -czf "$asset" -C "target/$TARGET/release" shiro
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "$asset" "$asset.sha256"
