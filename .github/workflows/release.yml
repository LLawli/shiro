name: release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-unknown-linux-musl

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"
          sudo apt-get update && sudo apt-get install -y musl-tools

      # musl so the artifact drops into an image with no library concerns,
      # which is the point of the whole distribution path.
      - name: Build
        run: cargo build --release --target "$TARGET"

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          asset="shiro-$ver-$TARGET.tar.gz"
          tar -czf "$asset" -C "target/$TARGET/release" shiro
          sha256sum "$asset" > "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes "$asset" "$asset.sha256"
