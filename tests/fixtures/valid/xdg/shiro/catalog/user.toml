# The user layer: a private group, in a home directory.

[[menu]]
path  = "install.games"
title = "Games"
order = 30

[[item]]
path      = "install.games.steam"
title     = "Steam"
mechanism = "flatpak"

# A check that never answers. It reports `timeout` rather than hanging a menu.
[item.hooks]
check        = "sleep 30"
install      = "true"
roll-install = "true"

# Everything a graphical front end reads and shiro does not interpret. The menu
# carries an icon too, because a menu is drawn as a row like any other.
[[menu]]
path     = "install.games.emulation"
title    = "Emulation"
icon     = "applications-games"
keywords = ["emulador", "retro"]
order    = 10

[[item]]
path        = "install.games.emulation.retroarch"
title       = "RetroArch"
icon        = "\uf11b"
keywords    = ["emulador", "retro"]
confirm     = "RetroArch baixa vários gigabytes. Seguir?"
destructive = false
interactive = true
keep_open   = true
mechanism   = "flatpak"

[item.hooks]
install      = "true"
roll-install = "true"

# An action: it runs, and there is no sense in which it is installed. The
# listing carries no `status` for it at all.
[[action]]
path        = "install.games.emulation.reset-pads"
title       = "Reset the controllers"
description = "Drops the pairing of every pad"
icon        = "input-gaming"
destructive = true
order       = 20

[action.hooks]
run = "true"
