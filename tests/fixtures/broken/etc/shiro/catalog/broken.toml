# Every rule the validator enforces, broken once.

# A root node claiming a native command.
[[menu]]
path  = "doctor"
title = "Not the doctor"

# An item whose parent nothing declares.
[[item]]
path  = "nowhere.orphan"
title = "Orphan"

[item.hooks]
install      = "true"
roll-install = "true"

[[menu]]
path  = "broken"
title = "Broken"

# An install with no way back, under the default atomic policy.
[[item]]
path  = "broken.no-rollback"
title = "No rollback"

[item.hooks]
install = "true"

# A pre that mutates and cannot be undone.
[[item]]
path        = "broken.mutating-pre"
title       = "Mutating pre"
pre_mutates = true

[item.hooks]
pre          = "true"
install      = "true"
roll-install = "true"

# A script that is not next to its recipe, and one that climbs out of the layer.
[[item]]
path  = "broken.missing-script"
title = "Missing script"

[item.hooks]
check        = { file = "nowhere.sh" }
install      = { file = "../escape.sh" }
roll-install = "true"

# A backend that does not exist. Nothing else about the declaration is reported,
# because nothing else can be read without knowing which shape it is.
[[item]]
path  = "broken.bad-permissions"
title = "Bad permissions"

[item.hooks]
install      = "true"
roll-install = "true"

[item.permissions]
backend = "podman"
app     = "   "

# An empty application name, which names no profile file.
[[item]]
path  = "broken.nameless-permissions"
title = "Permissions for nobody"

[item.hooks]
install      = "true"
roll-install = "true"

[item.permissions]
backend = "flatpak"
app     = "  "

# A profile in the permission vocabulary, holding a value flatpak does not have
# and one of the three that can never be granted. `apply` refuses both, and it
# runs in this recipe's `post`, on the machine of whoever installed.
[[item]]
path  = "broken.bad-vocabulary"
title = "Permissions that apply would refuse"

[item.hooks]
install      = "true"
roll-install = "true"

[item.permissions]
backend = "flatpak"
app     = "com.example.Broken"

[item.permissions.flatpak]
allow = ["device=gpu", "bus=org.freedesktop.Flatpak"]

# A declaration whose block belongs to the other backend, so the half its author
# wrote is the half nothing reads.
[[item]]
path  = "broken.wrong-block"
title = "The other backend's block"

[item.hooks]
install      = "true"
roll-install = "true"

[item.permissions]
backend = "run"
app     = "broken-app"

[item.permissions.flatpak]
allow = ["socket=wayland"]

# A misspelled key, which the profile the registry would write cannot hold.
[[item]]
path  = "broken.misspelled-permission"
title = "Misspelled permission key"

[item.hooks]
install      = "true"
roll-install = "true"

[item.permissions]
backend = "run"
app     = "broken-typo"

[item.permissions.run]
command = "/usr/bin/true"
shate   = ["wayland"]

# An item declared as a child of an item.
[[item]]
path  = "broken.no-rollback.child"
title = "Child of an item"

[item.hooks]
install      = "true"
roll-install = "true"

# A keyword that matches every search, and a confirmation with no question.
[[item]]
path     = "broken.presentation"
title    = "Bad presentation"
keywords = ["editor", "  "]
confirm  = ""

[item.hooks]
install      = "true"
roll-install = "true"

# An action whose only hook points at a script that is not there.
[[action]]
path  = "broken.act"
title = "Missing run script"

[action.hooks]
run = { file = "gone.sh" }

# A list whose generator points at a script that is not there, and which is
# empty besides: both commands answer to the rules every hook answers to.
[[list]]
path  = "broken.pick"
title = "Bad list"

[list.entries]
command = { file = "generate.sh" }

[list.hooks]
run = "true"

[[list]]
path  = "broken.pick-nothing"
title = "Lists nothing at all"

[list.entries]
command = "   "

[list.hooks]
run = "true"

# A node declared under a list, which nothing can navigate to: the segment
# after a list names an entry, and the tree is never consulted for it.
[[item]]
path  = "broken.pick.one"
title = "Child of a list"

[item.hooks]
install      = "true"
roll-install = "true"

# A node declared under an action, which has no children either.
[[item]]
path  = "broken.act.one"
title = "Child of an action"

[item.hooks]
install      = "true"
roll-install = "true"
