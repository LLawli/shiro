[package]
name = "shiro"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Turns a curated TOML catalog into an executable, navigable command tree"
license = "MIT"
readme = "README.md"
publish = false

[dependencies]
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = "1.1.4"

# The binary is spawned once per navigation step, so the release profile
# optimizes for startup and size rather than build time.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
